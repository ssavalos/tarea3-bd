version: "3.9"

services:
  mongo1:
    image: mongo:7.0
    container_name: mongo1
    hostname: mongo1
    command:
      [
        "bash",
        "-c",
        "cp /run/secrets/mongo-keyfile /tmp/mongo-keyfile && chmod 600 /tmp/mongo-keyfile && exec mongod --replSet my-replicaset --port 30001 --bind_ip_all --keyFile /tmp/mongo-keyfile",
      ]
    ports:
      - "30001:30001"
    volumes:
      - ./volumes/mongo1:/data/db
    secrets:
      - mongo-keyfile
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 30001 --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [mongo-net]

  mongo2:
    image: mongo:7.0
    container_name: mongo2
    hostname: mongo2
    command:
      [
        "bash",
        "-c",
        "cp /run/secrets/mongo-keyfile /tmp/mongo-keyfile && chmod 600 /tmp/mongo-keyfile && exec mongod --replSet my-replicaset --port 30002 --bind_ip_all --keyFile /tmp/mongo-keyfile",
      ]
    ports:
      - "30002:30002"
    volumes:
      - ./volumes/mongo2:/data/db
    secrets:
      - mongo-keyfile
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 30002 --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      mongo1:
        condition: service_healthy
    networks: [mongo-net]

  mongo3:
    image: mongo:7.0
    container_name: mongo3
    hostname: mongo3
    command:
      [
        "bash",
        "-c",
        "cp /run/secrets/mongo-keyfile /tmp/mongo-keyfile && chmod 600 /tmp/mongo-keyfile && exec mongod --replSet my-replicaset --port 30003 --bind_ip_all --keyFile /tmp/mongo-keyfile",
      ]
    ports:
      - "30003:30003"
    volumes:
      - ./volumes/mongo3:/data/db
    secrets:
      - mongo-keyfile
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 30003 --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      mongo1:
        condition: service_healthy
    networks: [mongo-net]

  # Inicializa el Replica Set automáticamente al levantar (opcional pero recomendado)
  rs-init:
    image: mongo:7.0
    container_name: rs-init
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    volumes:
      - ./docker/init:/docker-entrypoint-init
    entrypoint: [ "bash", "-c", "sleep 8 && mongosh --host mongo1 --port 30001 /docker-entrypoint-init/init-rs.js" ]
    networks: [mongo-net]

networks:
  mongo-net:
    driver: bridge

secrets:
  mongo-keyfile:
    file: ./docker/keyfile/mongo-keyfile
